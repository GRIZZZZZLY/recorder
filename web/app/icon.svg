<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Осциллограмма на графите. Красная полоса — та же роль, что у акцента в
       интерфейсе: «сейчас идёт запись». Цвета числами, а не токенами: файл
       читает браузер, а не Tailwind. -->
  <rect width="32" height="32" rx="8" fill="#16181d"/>
  <g fill="#f5f5f7">
    <rect x="6" y="14" width="2" height="4" rx="1"/>
    <rect x="10" y="11" width="2" height="10" rx="1"/>
    <rect x="18" y="9" width="2" height="14" rx="1"/>
    <rect x="22" y="12" width="2" height="8" rx="1"/>
    <rect x="26" y="15" width="2" height="2" rx="1"/>
  </g>
  <rect x="14" y="6" width="2" height="20" rx="1" fill="#ff453a"/>
</svg>
