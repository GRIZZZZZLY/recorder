# Проверки на каждый push и pull request. Независимые работы: сервер с
# настоящим ffmpeg, хост-тесты прошивки (и под санитайзерами), сборка прошивки
# под ESP32-S3 в обоих профилях платы (XIAO Sense и Recorder RevA), переходная
# сборка через ESP-IDF, сборка фронтенда. Ни одна не требует платы.
#
# Что здесь НЕ проверяется и проверяться не может: микрофон, карта, ток,
# Wi-Fi — всё это ждёт настоящую XIAO (docs/hardware-bring-up.md).
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: server tests (pytest + ffmpeg)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: ffmpeg для проверок архива WAV -> FLAC
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r server/requirements.txt pytest
      - name: pytest — без ffmpeg пять проверок пропускались бы, здесь идут все
        run: cd server && python -m pytest -q -rs

  firmware-host-tests:
    name: firmware host tests (g++, 2245 проверок)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/host_tests.sh

  firmware-sanitizers:
    name: firmware host tests (ASan + UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Выход за границы массива, использование освобождённой памяти, утечки
      # и неопределённое поведение: в C++ этого не видно ни глазами, ни
      # обычными тестами, а прошивка должна работать девять часов подряд.
      - run: bash tools/host_tests.sh --sanitize

  firmware-build:
    name: firmware build (arduino-cli, esp32 3.3.11)
    runs-on: ubuntu-22.04
    env:
      ARDUINO_DIRECTORIES_DATA: ${{ github.workspace }}/.arduino/data
      ARDUINO_DIRECTORIES_DOWNLOADS: ${{ github.workspace }}/.arduino/downloads
      ARDUINO_DIRECTORIES_USER: ${{ github.workspace }}/.arduino/user
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Ядро esp32 из кэша
        id: core-cache
        uses: actions/cache@v4
        with:
          path: .arduino
          key: arduino-esp32-3.3.11-${{ runner.os }}
      - name: Ядро esp32 3.3.11 — та же версия, что у владельца
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
      - name: Профиль XIAO Sense — тот, что поедет на плату в октябре
        run: bash tools/build.sh --board sense
      - name: Профиль Recorder RevA — платы нет, только статическая сборка
        run: bash tools/build.sh --board reva

  firmware-idf:
    name: firmware build (ESP-IDF 5.5.5 + Arduino 3.3.11 as component)
    runs-on: ubuntu-22.04
    # Переходный путь к ESP-IDF: тот же исходный код, что и в Arduino-задании,
    # собирается через idf.py (firmware/). Зелёная с 18 сентября 2026, поэтому
    # блокирует, как и остальные проверки.
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
      # Готовые образы: у владельца IDF нет, прошивка IDF-сборки идёт отсюда
      # (esptool write_flash по адресам из flasher_args.json).
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-idf-sense
          retention-days: 14
          path: |
            firmware/build/flasher_args.json
            firmware/build/recorder.bin
            firmware/build/ota_data_initial.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin

  web:
    name: web typecheck + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Тесты web импортируют .ts напрямую: типы вырезает сам Node >= 22.18.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run typecheck
      # Магнит ленты дня — чистая функция, у web своего фреймворка нет и не надо.
      - run: cd web && npm test
      - run: cd web && npm run build
