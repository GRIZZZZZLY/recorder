# Проверки на каждый push и pull request. Четыре независимые работы:
# сервер с настоящим ffmpeg, хост-тесты прошивки, сборка прошивки под ESP32-S3,
# сборка фронтенда. Ни одна не требует платы.
#
# Что здесь НЕ проверяется и проверяться не может: микрофон, карта, ток,
# Wi-Fi — всё это ждёт настоящую XIAO (docs/hardware-bring-up.md).
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: server tests (pytest + ffmpeg)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: ffmpeg для проверок архива WAV -> FLAC
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r server/requirements.txt pytest
      - name: pytest — без ffmpeg пять проверок пропускались бы, здесь идут все
        run: cd server && python -m pytest -q -rs

  firmware-host-tests:
    name: firmware host tests (g++)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/host_tests.sh

  firmware-build:
    name: firmware build (arduino-cli, esp32 3.3.11)
    runs-on: ubuntu-22.04
    env:
      ARDUINO_DIRECTORIES_DATA: ${{ github.workspace }}/.arduino/data
      ARDUINO_DIRECTORIES_DOWNLOADS: ${{ github.workspace }}/.arduino/downloads
      ARDUINO_DIRECTORIES_USER: ${{ github.workspace }}/.arduino/user
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Ядро esp32 из кэша
        id: core-cache
        uses: actions/cache@v4
        with:
          path: .arduino
          key: arduino-esp32-3.3.11-${{ runner.os }}
      - name: Ядро esp32 3.3.11 — та же версия, что у владельца
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
      - run: bash tools/build.sh

  web:
    name: web typecheck + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run typecheck
      - run: cd web && npm run build
